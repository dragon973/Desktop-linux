<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASH_PROJECT // TUXER :: ROOT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap');

        :root { --neon: #00ff41; --bg: #050505; }

        body {
            background: var(--bg);
            color: var(--neon);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            overflow-x: hidden;
            text-transform: uppercase;
        }

        /* Glitch Background Effect */
        .scanline {
            position: fixed; width: 100%; height: 100%;
            background: linear-gradient(0deg, rgba(0,0,0,0.1) 50%, rgba(0,255,65,0.02) 50%);
            background-size: 100% 4px; pointer-events: none; z-index: 10;
        }

        .header { padding: 50px; border-bottom: 2px solid var(--neon); text-align: center; }
        .header h1 { font-family: 'Orbitron'; font-size: 3rem; letter-spacing: 5px; text-shadow: 0 0 15px var(--neon); }

        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px; padding: 50px;
        }

        .node {
            border: 1px solid var(--neon);
            padding: 20px;
            background: rgba(0, 255, 65, 0.05);
            transition: 0.3s;
            position: relative;
        }

        .node:hover { box-shadow: 0 0 20px var(--neon); background: rgba(0, 255, 65, 0.1); }

        .node h2 { color: #fff; }
        .status { font-size: 0.8rem; color: #aaa; margin-bottom: 10px; }

        .btn {
            display: block; margin-top: 20px;
            border: 1px solid var(--neon); padding: 10px;
            color: var(--neon); text-align: center; text-decoration: none;
            font-weight: bold; cursor: pointer;
        }
        .btn:hover { background: var(--neon); color: black; }

        /* Animated Loading Bar */
        .loader { width: 100%; height: 4px; background: #111; margin-top: 10px; }
        .loader-fill { height: 100%; background: var(--neon); width: 0%; animation: load 2s forwards; }
        @keyframes load { to { width: 100%; } }
    </style>
</head>
<body>
    <div class="scanline"></div>

    <div class="header">
        <h1>// SYSTEM_INIT //</h1>
        <p>HASH PROJECT :: TUXER [LINUX KERNEL MODS]</p>
    </div>

    <div class="grid-container">
        <div class="node">
            <div class="status">ID: GNOME_BASE // ONLINE</div>
            <h2>GNOME</h2>
            <div class="loader"><div class="loader-fill"></div></div>
            <a href="https://www.gnome.org" class="btn">EXECUTE NODE</a>
        </div>
        <div class="node">
            <div class="status">ID: KDE_PLASMA // ONLINE</div>
            <h2>KDE PLASMA</h2>
            <div class="loader"><div class="loader-fill" style="animation-delay: 0.5s;"></div></div>
            <a href="https://kde.org" class="btn">EXECUTE NODE</a>
        </div>
        <div class="node">
            <div class="status">ID: XFCE_LIGHT // ONLINE</div>
            <h2>XFCE</h2>
            <div class="loader"><div class="loader-fill" style="animation-delay: 1s;"></div></div>
            <a href="https://xfce.org" class="btn">EXECUTE NODE</a>
        </div>
    </div>

    <script>
        // Matrix Rain effect placeholder or console logs
        console.log("HASH_PROJECT [STARTED]");
        console.log("TUXER KERNEL LINKED...");
    </script>
</body>
</html>
